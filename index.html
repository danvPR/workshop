<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioDANV Workshop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --tw-red: #ff4c4c; --scratch-blue: #4c97ff; --bg-color: #f2f2f2; --text-main: #333; --border-color: #d9d9d9;}
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* NAVBAR */
        .navbar { background: var(--tw-red); height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: white; }
        .navbar-brand { font-size: 1.2rem; font-weight: bold; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }
        .btn { background: rgba(0,0,0,0.15); border: none; color: white; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: rgba(0,0,0,0.25); }
        .btn-primary { background: var(--scratch-blue); } .btn-primary:hover { background: #3381e5; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; flex: 1; width: 100%; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; margin-top: 20px;}
        
        /* CARD */
        .card { background: white; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: var(--scratch-blue); box-shadow: 0 4px 12px rgba(76, 151, 255, 0.2); transform: translateY(-4px); }
        .card-thumb { height: 140px; background: #e9f1fc; display: flex; align-items: center; justify-content: center; color: var(--scratch-blue); font-size: 3.5rem; }
        .card-body { padding: 12px; }
        .card-title { font-weight: bold; color: var(--scratch-blue); margin-bottom: 4px; }
        .card-author { font-size: 0.85rem; color: #777; font-weight: bold;}
        .card-author:hover { text-decoration: underline; color: var(--scratch-blue); }

        /* MODALS */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal { background: white; border-radius: 8px; width: 100%; max-width: 500px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;}
        .modal-header { background: var(--scratch-blue); color: white; padding: 16px 20px; display: flex; justify-content: space-between; font-weight: bold; }
        .btn-close { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .modal-body { padding: 20px; overflow-y: auto; }
        
        input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 15px; font-family: inherit;}
        label { font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px;}

        /* PLAYER & COMMENTS */
        .modal-player { max-width: 900px; }
        .player-wrapper { display: flex; flex-direction: column; height: 100%; }
        iframe { width: 100%; height: 400px; border: none; background: #000; }
        .comments-section { padding: 20px; background: #fafafa; border-top: 1px solid var(--border-color); flex: 1; overflow-y: auto;}
        .comment-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .avt-circle { width: 40px; height: 40px; border-radius: 50%; background: #ddd; object-fit: cover; flex-shrink: 0;}
        .comment-content { background: white; padding: 10px 15px; border-radius: 15px; border: 1px solid #eee; width: 100%;}
        .comment-author { font-weight: bold; font-size: 0.9rem; color: var(--scratch-blue); }
        .comment-text { font-size: 0.95rem; margin-top: 3px; }
        
        /* PROFILE */
        .profile-header { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .profile-avt { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--scratch-blue); }

        /* LOADING SCREEN CỰC XỊN */
        #globalLoader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHỜ (LOADING) -->
    <div id="globalLoader">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 4rem; color: #4c97ff; margin-bottom: 20px;"></i>
        <h2 id="loaderText" style="font-family: monospace; font-size: 1.2rem; color: #94a3b8;">Đang kết nối hệ thống...</h2>
    </div>

    <!-- THANH ĐIỀU HƯỚNG TRÊN CÙNG -->
    <nav class="navbar">
        <div class="navbar-brand"><i class="fa-solid fa-cat"></i> StudioDANV</div>
        <div class="nav-actions" id="navActions">
            <button class="btn btn-primary" onclick="loginScratch()"><i class="fa-solid fa-right-to-bracket"></i> Login with Scratch</button>
        </div>
    </nav>

    <!-- NỘI DUNG CHÍNH (HIỂN THỊ GAME) -->
    <div class="container">
        <h2 style="border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">Khám phá dự án</h2>
        <div class="project-grid" id="projectList">Đang tải...</div>
    </div>

    <!-- MODAL ĐĂNG GAME -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header"><span>Tải lên dự án</span><button class="btn-close" onclick="closeModal('uploadModal')">&times;</button></div>
            <div class="modal-body">
                <form onsubmit="handleUpload(event)">
                    <label>Tên dự án</label> <input type="text" id="projTitle" required>
                    <label>File (.sb3) - Tối đa 20MB</label> <input type="file" id="projFile" accept=".sb3" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;" id="btnUpload">Đăng dự án</button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL PROFILE -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal">
            <div class="modal-header"><span id="profNameTitle">Hồ sơ</span><button class="btn-close" onclick="closeModal('profileModal')">&times;</button></div>
            <div class="modal-body">
                <div class="profile-header">
                    <img src="" id="profAvt" class="profile-avt" onerror="this.src='https://scratch.mit.edu/images/avatar_default.gif'">
                    <div>
                        <h2 id="profUsername" style="color: var(--scratch-blue);">Username</h2>
                        <p id="profStatus" style="color: #666; font-style: italic; font-size: 0.9rem;">What I'm doing...</p>
                    </div>
                </div>
                <div style="margin-bottom: 20px;"><b>About me:</b> <p id="profBio" style="white-space: pre-line;"></p></div>
                
                <div id="editProfileForm" style="display: none; background: #f9f9f9; padding: 15px; border-radius: 8px;">
                    <h3 style="margin-bottom: 10px;">Chỉnh sửa hồ sơ</h3>
                    <form onsubmit="handleUpdateProfile(event)">
                        <label>Đổi Avatar (File ảnh)</label> <input type="file" id="editAvt" accept="image/*">
                        <label>What I'm doing</label> <input type="text" id="editStatus">
                        <label>About me</label> <textarea id="editBio" rows="3"></textarea>
                        <button type="submit" class="btn btn-primary" id="btnUpdateProf">Lưu thay đổi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PLAYER & COMMENTS -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal modal-player">
            <div class="modal-header"><span id="playerTitle">Game</span><button class="btn-close" onclick="closeModal('playerModal'); document.getElementById('gameIframe').src='';">&times;</button></div>
            <div class="player-wrapper">
                <iframe id="gameIframe" allow="fullscreen; autoplay; gamepad"></iframe>
                <div class="comments-section">
                    <h3 style="margin-bottom: 15px;">Bình luận</h3>
                    <div id="commentList"></div>
                    <form onsubmit="postComment(event)" id="commentForm" style="display:none; margin-top: 15px; display: flex; gap: 10px;">
                        <input type="text" id="commentText" placeholder="Viết bình luận..." required style="margin: 0; flex: 1;">
                        <button type="submit" class="btn btn-primary">Gửi</button>
                    </form>
                    <div id="loginToComment" style="text-align: center; color: #888; margin-top: 10px;">Đăng nhập để bình luận.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==============================================================
        // BƯỚC QUAN TRỌNG: ĐIỀN MÃ CLIENT ID CỦA SCRATCH WIKI OAUTH VÀO ĐÂY NHÉ:
        // ==============================================================
        const WIKI_CLIENT_ID = "70970406"; 
        // ==============================================================

        const WORKER_URL = "https://app.studiodanv.workers.dev";
        let currentUser = JSON.parse(localStorage.getItem('danv_user') || 'null');
        let allProjects = [];
        let currentPlayingFileId = null;

        // BẮT MÃ TỪ SCRATCH WIKI TRẢ VỀ VÀ XỬ LÝ LÚC VỪA MỞ TRANG
        window.onload = async () => {
            const loader = document.getElementById('globalLoader');
            const loaderText = document.getElementById('loaderText');
            const urlParams = new URLSearchParams(window.location.search);
            
            const authCode = urlParams.get('code');
            const authState = urlParams.get('state');
            
            if (authCode && authState) {
                // Xóa URL cho sạch sẽ để không bị rối mắt
                window.history.replaceState({}, document.title, window.location.pathname);
                
                // Kiểm tra State chống giả mạo
                const savedState = localStorage.getItem('oauth_state');
                if (authState !== savedState) {
                    alert("Lỗi bảo mật: Đăng nhập thất bại (Dữ liệu phiên không khớp).");
                } else {
                    loaderText.innerText = "Đang xác thực bảo mật với Scratch Wiki...";
                    try {
                        const res = await fetch(`${WORKER_URL}/api/auth/verify`, {
                            method: 'POST', body: JSON.stringify({ code: authCode })
                        });
                        const data = await res.json();
                        
                        if (data.success) {
                            currentUser = { username: data.username, sessionToken: data.sessionToken };
                            loaderText.innerText = "Đang tải hồ sơ của bạn...";
                            const profData = await (await fetch(`${WORKER_URL}/api/user/${data.username}`)).json();
                            currentUser.avt = profData.avt || '';
                            localStorage.setItem('danv_user', JSON.stringify(currentUser));
                        } else {
                            alert(`❌ Đăng nhập thất bại: ${data.error || data.details}`);
                        }
                    } catch (err) {
                        alert(`❌ LỖI MÁY CHỦ:\nKhông thể kết nối đến máy chủ Cloudflare.\nChi tiết lỗi: ${err.message}`);
                    }
                }
            }
            
            loaderText.innerText = "Đang tải kho dự án...";
            await fetchProjects();
            updateNav();
            
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 400);
        };

        // GIAO DIỆN NAVBAR
        function updateNav() {
            const nav = document.getElementById('navActions');
            if (currentUser) {
                nav.innerHTML = `
                    <span style="font-weight:bold; cursor:pointer;" onclick="openProfile('${currentUser.username}')">👋 Chào, ${currentUser.username}</span>
                    <button class="btn" onclick="document.getElementById('uploadModal').style.display='flex'">Đăng game</button>
                    <button class="btn" style="background:#444;" onclick="logout()">Thoát</button>
                `;
            } else {
                nav.innerHTML = `<button class="btn btn-primary" onclick="loginScratch()"><i class="fa-solid fa-right-to-bracket"></i> Login with Scratch</button>`;
            }
        }

        // HÀM CHUYỂN HƯỚNG SANG TRANG ĐĂNG NHẬP CỦA SCRATCH WIKI
        function loginScratch() {
            if (!WIKI_CLIENT_ID || WIKI_CLIENT_ID === "ĐIỀN_SỐ_CLIENT_ID_CỦA_BẠN_VÀO_ĐÂY") {
                alert("Lỗi: Bạn chưa điền Client ID vào code HTML!");
                return;
            }
            const redirectUri = window.location.origin + window.location.pathname;
            const state = Math.random().toString(36).substring(2); // Tạo mã ngẫu nhiên để bảo mật
            localStorage.setItem('oauth_state', state); 
            
            // Chuyển hướng người dùng qua Scratch Wiki để họ bấm nút "Xác nhận"
            const authUrl = `https://oauth2.scratch-wiki.info/wiki/Special:ScratchOAuth2/authorize?client_id=${WIKI_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&scopes=identify&state=${state}`;
            window.location.href = authUrl;
        }

        function logout() { localStorage.removeItem('danv_user'); currentUser = null; updateNav(); }

        // LOAD GAME TỪ MÁY CHỦ VỀ
        async function fetchProjects() {
            try {
                const res = await (await fetch(`${WORKER_URL}/api/projects`)).json();
                if(res.error) throw new Error(res.error + " - " + res.details);
                allProjects = res;
                
                document.getElementById('projectList').innerHTML = allProjects.map(p => `
                    <div class="card">
                        <div class="card-thumb" onclick="playGame('${p.fileId}', '${p.title}')"><i class="fa-solid fa-play"></i></div>
                        <div class="card-body">
                            <div class="card-title" onclick="playGame('${p.fileId}', '${p.title}')">${p.title}</div>
                            <div class="card-author" onclick="openProfile('${p.author}')">By: ${p.author}</div>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('projectList').innerHTML = `<div style="color:red; grid-column: 1/-1;">❌ Lỗi máy chủ không thể tải game. Chi tiết: ${e.message}</div>`;
            }
        }

        // CHƠI GAME & BÌNH LUẬN
        function playGame(fileId, title) {
            currentPlayingFileId = fileId;
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('gameIframe').src = `https://turbowarp.org/embed.html?project_url=${encodeURIComponent(WORKER_URL+'/api/project/'+fileId)}&ui-theme=dark&autoplay=on`;
            
            const proj = allProjects.find(p => p.fileId === fileId);
            renderComments(proj.comments || []);
            
            if (currentUser) {
                document.getElementById('commentForm').style.display = 'flex';
                document.getElementById('loginToComment').style.display = 'none';
            }
            document.getElementById('playerModal').style.display = 'flex';
        }

        function getAvtUrl(id) { return id ? `${WORKER_URL}/api/project/${id}` : 'https://scratch.mit.edu/images/avatar_default.gif'; }

        function renderComments(comments) {
            document.getElementById('commentList').innerHTML = comments.map(c => `
                <div class="comment-box">
                    <img src="${getAvtUrl(c.avt)}" class="avt-circle" onclick="openProfile('${c.author}')" style="cursor:pointer;">
                    <div class="comment-content">
                        <div class="comment-author" onclick="openProfile('${c.author}')" style="cursor:pointer;">${c.author} <span style="font-size:0.75rem; color:#999; font-weight:normal;">${c.time}</span></div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                </div>
            `).join('');
        }

        async function postComment(e) {
            e.preventDefault();
            const text = document.getElementById('commentText').value;
            const res = await fetch(`${WORKER_URL}/api/comment`, {
                method: 'POST', body: JSON.stringify({ fileId: currentPlayingFileId, username: currentUser.username, sessionToken: currentUser.sessionToken, text: text, avt: currentUser.avt })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('commentText').value = '';
                const proj = allProjects.find(p => p.fileId === currentPlayingFileId);
                if(!proj.comments) proj.comments = [];
                proj.comments.push(data.comment);
                renderComments(proj.comments);
            }
        }

        // XEM & SỬA PROFILE
        async function openProfile(username) {
            document.getElementById('profNameTitle').innerText = `Hồ sơ: ${username}`;
            document.getElementById('profUsername').innerText = username;
            document.getElementById('profStatus').innerText = "Đang tải...";
            document.getElementById('profBio').innerText = "";
            document.getElementById('editProfileForm').style.display = 'none';
            document.getElementById('profileModal').style.display = 'flex';

            const data = await (await fetch(`${WORKER_URL}/api/user/${username}`)).json();
            document.getElementById('profAvt').src = getAvtUrl(data.avt);
            document.getElementById('profStatus').innerText = data.status || "Chưa có trạng thái";
            document.getElementById('profBio').innerText = data.bio || "Người dùng này lười quá, chưa viết gì cả!";

            if (currentUser && currentUser.username === username) {
                document.getElementById('editProfileForm').style.display = 'block';
                document.getElementById('editStatus').value = data.status;
                document.getElementById('editBio').value = data.bio;
                document.getElementById('editProfileForm').dataset.currentAvt = data.avt;
            }
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('btnUpdateProf'); btn.innerText = "Đang lưu...";
            
            const form = new FormData();
            form.append("username", currentUser.username);
            form.append("sessionToken", currentUser.sessionToken);
            form.append("bio", document.getElementById('editBio').value);
            form.append("status", document.getElementById('editStatus').value);
            form.append("currentAvt", document.getElementById('editProfileForm').dataset.currentAvt);
            
            const file = document.getElementById('editAvt').files[0];
            if (file) form.append("avtFile", file);

            const res = await (await fetch(`${WORKER_URL}/api/user/update`, { method: 'POST', body: form })).json();
            if (res.success) {
                currentUser.avt = res.avtId; localStorage.setItem('danv_user', JSON.stringify(currentUser));
                openProfile(currentUser.username); 
            } else alert(res.error);
            btn.innerText = "Lưu thay đổi";
        }

        // ĐĂNG GAME
        async function handleUpload(e) {
            e.preventDefault();
            const file = document.getElementById('projFile').files[0];
            if (file.size > 20*1024*1024) return alert("File > 20MB. Vui lòng giảm dung lượng!");
            
            const btn = document.getElementById('btnUpload'); btn.innerText = "Đang tải...";
            const form = new FormData();
            form.append("file", file); form.append("title", document.getElementById('projTitle').value);
            form.append("author", currentUser.username);

            const res = await (await fetch(`${WORKER_URL}/api/upload`, { method: 'POST', body: form })).json();
            if (res.success) { alert("Thành công!"); closeModal('uploadModal'); fetchProjects(); }
            btn.innerText = "Đăng dự án";
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
