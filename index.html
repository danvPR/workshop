<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioDANV Workshop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --tw-red: #ff4c4c; 
            --scratch-blue: #4c97ff; 
            --scratch-green: #0fbd8c;
            --bg-color: #f2f2f2; 
            --text-main: #333; 
            --border-color: #d9d9d9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* NAVBAR */
        .navbar { background: var(--tw-red); height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .nav-brand { font-size: 1.25rem; font-weight: bold; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }
        
        .btn { background: rgba(0,0,0,0.15); border: none; color: white; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; text-decoration: none; }
        .btn:hover { background: rgba(0,0,0,0.25); }
        .btn-primary { background: var(--scratch-blue); } .btn-primary:hover { background: #3381e5; }
        .btn-create { background: var(--scratch-green); } .btn-create:hover { background: #0da57a; }
        
        /* CONTAINER & GRID */
        .container { max-width: 1050px; margin: 0 auto; padding: 24px 20px; flex: 1; width: 100%; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-top: 20px;}
        .card { background: white; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column;}
        .card:hover { border-color: var(--scratch-blue); box-shadow: 0 4px 12px rgba(76, 151, 255, 0.2); transform: translateY(-3px); }
        .card-thumb { height: 140px; background: #e9f1fc; display: flex; align-items: center; justify-content: center; color: var(--scratch-blue); font-size: 3rem; }
        .card-body { padding: 12px; }
        .card-title { font-weight: bold; color: var(--scratch-blue); margin-bottom: 4px; }
        .card-author { font-size: 0.85rem; color: #777; }

        /* MODALS (CỬA SỔ POPUP) */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 15px; }
        .modal { background: white; border-radius: 8px; width: 100%; max-width: 500px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        .modal-header { background: var(--scratch-blue); color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .btn-close { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .modal-body { padding: 20px; overflow-y: auto; }
        
        /* PLAYER MODAL */
        .modal-player { max-width: 850px; }
        .player-actions-bar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; }
        .player-wrapper { background: #000; border-radius: 6px; overflow: hidden; height: 420px; margin-bottom: 16px; }
        iframe { width: 100%; height: 100%; border: none; }

        /* COMMENTS */
        .comment-box { display: flex; gap: 10px; margin-bottom: 12px; }
        .avt-circle { width: 36px; height: 36px; border-radius: 50%; background: #ddd; object-fit: cover; flex-shrink: 0;}
        .comment-content { background: #f8fafc; padding: 8px 12px; border-radius: 12px; border: 1px solid #e2e8f0; width: 100%;}
        .comment-author { font-weight: bold; font-size: 0.85rem; color: var(--scratch-blue); }
        .comment-text { font-size: 0.9rem; margin-top: 2px; }

        /* PROFILE */
        .profile-header { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .profile-avt { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--scratch-blue); }

        input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 12px; }
        label { font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 4px; }
        
        #globalLoader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.3s ease; }
    </style>
</head>
<body>

    <div id="globalLoader">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 4rem; color: #4c97ff; margin-bottom: 20px;"></i>
        <h2 id="loaderText" style="font-family: monospace; font-size: 1.2rem; color: #94a3b8;">Đang kết nối Workshop...</h2>
    </div>

    <!-- THANH MENU -->
    <nav class="navbar">
        <a href="#" class="nav-brand"><i class="fa-solid fa-cat"></i> StudioDANV Workshop</a>
        <div class="nav-actions" id="navActions">
            <button class="btn btn-create" onclick="openTurboWarpEditor()"><i class="fa-solid fa-wand-magic-sparkles"></i> Tạo dự án mới</button>
            <button class="btn btn-primary" onclick="loginScratch()"><i class="fa-solid fa-right-to-bracket"></i> Login with Scratch</button>
        </div>
    </nav>

    <!-- DANH SÁCH DỰ ÁN TRANG CHỦ -->
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">
            <h2>Khám phá dự án cộng đồng</h2>
            <span id="projectCount" style="color: #64748b; font-weight: bold;">0 dự án</span>
        </div>
        <div class="project-grid" id="projectList">Đang tải danh sách game...</div>
    </div>

    <!-- 🌟 MODAL 1: CHƠI GAME & XEM CODE -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal modal-player">
            <div class="modal-header">
                <span id="playerTitle">Tên dự án</span>
                <button class="btn-close" onclick="closePlayerModal()">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Thanh công cụ điều khiển nhanh -->
                <div class="player-actions-bar">
                    <button class="btn btn-primary" id="btnOpenNewTabPlay" onclick="openGameInNewTab()"><i class="fa-solid fa-up-right-from-square"></i> Mở chơi Tab mới (Cực mượt)</button>
                    <button class="btn btn-create" id="btnOpenSeeInsideTab" onclick="openSeeInsideInNewTab()"><i class="fa-solid fa-code"></i> See inside (Xem code)</button>
                    <a id="btnDownloadSb3" href="#" download class="btn" style="background:#64748b;"><i class="fa-solid fa-download"></i> Tải .sb3</a>
                </div>

                <!-- Khung nhúng Player -->
                <div class="player-wrapper">
                    <iframe id="gameIframe" allow="fullscreen; autoplay; gamepad; camera; microphone"></iframe>
                </div>

                <!-- Tác giả & Bình luận -->
                <div style="margin-bottom: 15px; font-size: 0.95rem;">
                    Tác giả: <a href="javascript:void(0)" id="playerAuthorLink" onclick="openAuthorProfile()" style="color: var(--scratch-blue); font-weight: bold; text-decoration: none;">Author</a>
                </div>

                <div style="border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <h3 style="margin-bottom: 10px; font-size: 1rem;">Bình luận</h3>
                    <div id="commentList" style="max-height: 180px; overflow-y: auto; margin-bottom: 12px;"></div>
                    
                    <form onsubmit="handlePostComment(event)" id="commentForm" style="display:none; display: flex; gap: 8px;">
                        <input type="text" id="commentInput" placeholder="Viết bình luận của bạn..." required style="margin: 0; flex: 1;">
                        <button type="submit" class="btn btn-primary">Gửi</button>
                    </form>
                    <div id="loginToComment" style="text-align: center; color: #888; font-size: 0.85rem; padding: 6px; background: #fafafa; border-radius: 4px;">
                        <a href="javascript:void(0)" onclick="loginScratch()" style="color: var(--scratch-blue); font-weight: bold;">Đăng nhập</a> để tham gia bình luận.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 MODAL 2: PROFILE CÁ NHÂN -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal">
            <div class="modal-header">
                <span id="profNameTitle">Hồ sơ</span>
                <button class="btn-close" onclick="closeModal('profileModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="profile-header">
                    <img id="profAvt" src="" class="profile-avt" onerror="this.src='https://scratch.mit.edu/images/avatar_default.gif'">
                    <div>
                        <h2 id="profUsername" style="color: var(--scratch-blue);">Username</h2>
                        <p id="profStatus" style="color: #666; font-style: italic; font-size: 0.9rem;">What I'm doing...</p>
                    </div>
                </div>
                <div style="margin-bottom: 15px;"><b>About me:</b> <p id="profBio" style="white-space: pre-line; color: #444;"></p></div>

                <!-- Form sửa Profile (chỉ hiện khi là chính chủ) -->
                <div id="editProfBox" style="display: none; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px;">
                    <h4 style="margin-bottom: 10px;">Chỉnh sửa thông tin</h4>
                    <form onsubmit="handleSaveProfile(event)">
                        <label>Đổi Avatar (File ảnh):</label> <input type="file" id="editAvtFile" accept="image/*">
                        <label>What I'm doing:</label> <input type="text" id="editStatusInput">
                        <label>About me:</label> <textarea id="editBioInput" rows="2"></textarea>
                        <button type="submit" class="btn btn-create" id="btnSaveProf">Lưu thay đổi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 MODAL 3: ĐĂNG DỰ ÁN (.SB3) -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <span>Đăng dự án lên Workshop</span>
                <button class="btn-close" onclick="closeModal('uploadModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleUpload(event)">
                    <label>Tên dự án:</label>
                    <input type="text" id="projTitle" required placeholder="Ví dụ: Flappy Bird 2.0">
                    <label>Chọn file Scratch (.sb3) - Tối đa 20MB:</label>
                    <input type="file" id="projFile" accept=".sb3" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;" id="btnUploadSubmit">Đăng lên Workshop</button>
                </form>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT HỆ THỐNG -->
    <script>
        const WIKI_CLIENT_ID = "70970406"; 
        const WORKER_URL = "https://app.studiodanv.workers.dev";
        
        let currentUser = JSON.parse(localStorage.getItem('danv_user') || 'null');
        let allProjects = [];
        let currentProj = null;

        // 1. KHỞI TẠO TRANG
        async function startApp() {
            const loader = document.getElementById('globalLoader');
            try {
                // Xử lý OAuth2 đăng nhập
                const urlParams = new URLSearchParams(window.location.search);
                const authCode = urlParams.get('code');
                const authState = urlParams.get('state');
                
                if (authCode && authState) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    const savedState = localStorage.getItem('oauth_state');
                    
                    if (authState === savedState) {
                        const res = await fetch(`${WORKER_URL}/api/auth/verify`, {
                            method: 'POST', body: JSON.stringify({ code: authCode })
                        });
                        const data = await res.json();
                        if (data.success) {
                            currentUser = { username: data.username, sessionToken: data.sessionToken };
                            try {
                                const prof = await (await fetch(`${WORKER_URL}/api/user/${data.username}`)).json();
                                currentUser.avt = prof.avt || '';
                            } catch(e) {}
                            localStorage.setItem('danv_user', JSON.stringify(currentUser));
                            alert(`🎉 Chào mừng ${data.username} đã đăng nhập thành công!`);
                        }
                    }
                }

                await fetchProjects();
                updateNav();
            } catch (err) {
                console.error("Lỗi:", err);
            } finally {
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 300);
                }
            }
        }

        // 2. THANH NAVBAR
        function updateNav() {
            const nav = document.getElementById('navActions');
            const createBtn = `<button class="btn btn-create" onclick="openTurboWarpEditor()"><i class="fa-solid fa-wand-magic-sparkles"></i> Tạo dự án</button>`;
            
            if (currentUser) {
                nav.innerHTML = `
                    ${createBtn}
                    <button class="btn btn-primary" onclick="openModal('uploadModal')"><i class="fa-solid fa-cloud-arrow-up"></i> Đăng game</button>
                    <a href="javascript:void(0)" onclick="openProfile('${currentUser.username}')" class="btn" style="background: rgba(0,0,0,0.25);">
                        <img src="${getAvtUrl(currentUser.avt)}" style="width:20px; height:20px; border-radius:50%; object-fit:cover;">
                        ${currentUser.username}
                    </a>
                    <button class="btn" style="background:#444;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
                `;
            } else {
                nav.innerHTML = `
                    ${createBtn}
                    <button class="btn btn-primary" onclick="loginScratch()"><i class="fa-solid fa-right-to-bracket"></i> Login with Scratch</button>
                `;
            }
        }

        function loginScratch() {
            const redirectUri = window.location.origin + window.location.pathname;
            const state = Math.random().toString(36).substring(2);
            localStorage.setItem('oauth_state', state);
            window.location.href = `https://oauth2.scratch-wiki.info/wiki/Special:ScratchOAuth2/authorize?client_id=${WIKI_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&scopes=identify&state=${state}`;
        }

        function logout() { 
            localStorage.removeItem('danv_user'); 
            currentUser = null; 
            updateNav(); 
        }

        // Mở trình soạn thảo TurboWarp trên Tab mới (100% không lo lỗi)
        function openTurboWarpEditor() {
            window.open('https://turbowarp.org/editor', '_blank');
        }

        // 3. TẢI VÀ HIỂN THỊ DỰ ÁN
        async function fetchProjects() {
            try {
                const res = await (await fetch(`${WORKER_URL}/api/projects`)).json();
                if(!res.error) allProjects = res;
                
                document.getElementById('projectCount').innerText = `${allProjects.length} dự án`;
                const list = document.getElementById('projectList');
                
                if (allProjects.length === 0) {
                    list.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#888; padding:40px;">Chưa có dự án nào. Hãy bấm "Tạo dự án" để bắt đầu!</div>`;
                    return;
                }

                list.innerHTML = allProjects.map(p => `
                    <div class="card" onclick="openPlayerModal('${p.fileId}')">
                        <div class="card-thumb"><i class="fa-solid fa-play"></i></div>
                        <div class="card-body">
                            <div class="card-title">${escapeHtml(p.title)}</div>
                            <div class="card-author">Tác giả: <b>${escapeHtml(p.author)}</b></div>
                        </div>
                    </div>
                `).join('');
            } catch(e) {}
        }

        // 4. MỞ CỬA SỔ CHƠI GAME (MODAL)
        function openPlayerModal(fileId) {
            const proj = allProjects.find(p => p.fileId === fileId);
            if (!proj) return;
            currentProj = proj;

            document.getElementById('playerTitle').innerText = proj.title;
            document.getElementById('playerAuthorLink').innerText = proj.author;
            
            const fileUrl = `${WORKER_URL}/api/project/${proj.fileId}`;
            document.getElementById('btnDownloadSb3').href = fileUrl;
            
            // Nhúng player trực tiếp
            document.getElementById('gameIframe').src = `https://turbowarp.org/editor?project_url=${encodeURIComponent(fileUrl)}`;

            renderComments(proj.comments || []);
            
            if (currentUser) {
                document.getElementById('commentForm').style.display = 'flex';
                document.getElementById('loginToComment').style.display = 'none';
            } else {
                document.getElementById('commentForm').style.display = 'none';
                document.getElementById('loginToComment').style.display = 'block';
            }

            openModal('playerModal');
        }

        function closePlayerModal() {
            closeModal('playerModal');
            document.getElementById('gameIframe').src = '';
            currentProj = null;
        }

        function openGameInNewTab() {
            if (!currentProj) return;
            const fileUrl = `${WORKER_URL}/api/project/${currentProj.fileId}`;
            window.open(`https://turbowarp.org/?project_url=${encodeURIComponent(fileUrl)}`, '_blank');
        }

        function openSeeInsideInNewTab() {
            if (!currentProj) return;
            const fileUrl = `${WORKER_URL}/api/project/${currentProj.fileId}`;
            window.open(`https://turbowarp.org/editor?project_url=${encodeURIComponent(fileUrl)}`, '_blank');
        }

        function openAuthorProfile() {
            if (!currentProj) return;
            openProfile(currentProj.author);
        }

        // 5. BÌNH LUẬN
        function renderComments(comments) {
            const container = document.getElementById('commentList');
            if (comments.length === 0) {
                container.innerHTML = `<div style="color:#888; font-style:italic;">Chưa có bình luận nào.</div>`;
                return;
            }
            container.innerHTML = comments.map(c => `
                <div class="comment-box">
                    <img src="${getAvtUrl(c.avt)}" class="avt-circle" onclick="openProfile('${encodeURIComponent(c.author)}')" style="cursor:pointer;">
                    <div class="comment-content">
                        <div><a href="javascript:void(0)" onclick="openProfile('${encodeURIComponent(c.author)}')" class="comment-author">${escapeHtml(c.author)}</a> <small style="color:#94a3b8; font-size:0.75rem;">${c.time}</small></div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                    </div>
                </div>
            `).join('');
        }

        async function handlePostComment(e) {
            e.preventDefault();
            if (!currentUser || !currentProj) return;
            
            const input = document.getElementById('commentInput');
            const text = input.value;

            const res = await fetch(`${WORKER_URL}/api/comment`, {
                method: 'POST', body: JSON.stringify({
                    fileId: currentProj.fileId,
                    projTitle: currentProj.title,
                    projAuthor: currentProj.author,
                    username: currentUser.username,
                    sessionToken: currentUser.sessionToken,
                    text: text,
                    avt: currentUser.avt
                })
            });
            const data = await res.json();
            if (data.success) {
                input.value = '';
                if (!currentProj.comments) currentProj.comments = [];
                currentProj.comments.push(data.comment);
                renderComments(currentProj.comments);
            }
        }

        // 6. PROFILE MODAL
        async function openProfile(username) {
            document.getElementById('profNameTitle').innerText = `Hồ sơ: ${username}`;
            document.getElementById('profUsername').innerText = username;
            document.getElementById('profStatus').innerText = "Đang tải...";
            document.getElementById('profBio').innerText = "";
            document.getElementById('editProfBox').style.display = 'none';

            const isOwn = currentUser && currentUser.username === username;
            if (isOwn) {
                document.getElementById('editProfBox').style.display = 'block';
            }

            openModal('profileModal');

            try {
                const data = await (await fetch(`${WORKER_URL}/api/user/${encodeURIComponent(username)}`)).json();
                document.getElementById('profAvt').src = getAvtUrl(data.avt);
                document.getElementById('profStatus').innerText = data.status || "Chưa có trạng thái";
                document.getElementById('profBio').innerText = data.bio || "Chưa có thông tin giới thiệu.";
                
                if (isOwn) {
                    document.getElementById('editStatusInput').value = data.status || "";
                    document.getElementById('editBioInput').value = data.bio || "";
                    document.getElementById('editProfBox').dataset.currentAvt = data.avt || "";
                }
            } catch(e) {}
        }

        async function handleSaveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSaveProf');
            btn.innerText = "Đang lưu...";
            
            const form = new FormData();
            form.append("username", currentUser.username);
            form.append("sessionToken", currentUser.sessionToken);
            form.append("bio", document.getElementById('editBioInput').value);
            form.append("status", document.getElementById('editStatusInput').value);
            form.append("currentAvt", document.getElementById('editProfBox').dataset.currentAvt || "");
            
            const file = document.getElementById('editAvtFile').files[0];
            if (file) form.append("avtFile", file);

            const res = await (await fetch(`${WORKER_URL}/api/user/update`, { method: 'POST', body: form })).json();
            if (res.success) {
                currentUser.avt = res.avtId;
                localStorage.setItem('danv_user', JSON.stringify(currentUser));
                updateNav();
                openProfile(currentUser.username);
            } else alert(res.error);
            btn.innerText = "Lưu thay đổi";
        }

        // 7. UPLOAD DỰ ÁN
        async function handleUpload(e) {
            e.preventDefault();
            const file = document.getElementById('projFile').files[0];
            if (file.size > 20*1024*1024) return alert("File > 20MB. Vui lòng nén bớt dung lượng!");
            
            const btn = document.getElementById('btnUploadSubmit');
            btn.innerText = "Đang tải lên...";
            
            const form = new FormData();
            form.append("file", file);
            form.append("title", document.getElementById('projTitle').value);
            form.append("author", currentUser ? currentUser.username : "Ẩn danh");

            const res = await (await fetch(`${WORKER_URL}/api/upload`, { method: 'POST', body: form })).json();
            if (res.success) {
                alert("🎉 Đăng dự án thành công!");
                closeModal('uploadModal');
                await fetchProjects();
            } else alert(res.error);
            btn.innerText = "Đăng lên Workshop";
        }

        // TIỆN ÍCH MODAL
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function getAvtUrl(id) { return id ? `${WORKER_URL}/api/project/${id}` : 'https://scratch.mit.edu/images/avatar_default.gif'; }
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
